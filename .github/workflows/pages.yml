name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Publish the search engine ownership file
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [[ -n "$INDEXNOW_KEY" ]]; then
            [[ "$INDEXNOW_KEY" =~ ^[a-f0-9]{32}$ ]]
            printf '%s' "$INDEXNOW_KEY" > "dist/pages/$INDEXNOW_KEY.txt"
          fi
      - uses: actions/configure-pages@v5
      - id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: publish
        uses: actions/github-script@v8
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: context.sha, oidc_token: await core.getIDToken()
            });
            core.setOutput('page_url', data.page_url);
            for (let attempt = 0; attempt < 90; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 4000));
              const result = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', {
                owner, repo, id: data.id || context.sha
              });
              const state = result.data.status;
              if (state === 'succeed') return;
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled'].includes(state)) {
                throw new Error('Pages deployment ended with ' + state);
              }
            }
            throw new Error('Timed out waiting for GitHub Pages');
